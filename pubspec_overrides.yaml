# Sandbox overrides (Lot B) — NOT COMMITTED.
# Replaces the unavailable Flutter SDK packages with local no-op stubs so that
# `dart pub get` / `dart run build_runner` / `dart test` work in the Dart-only
# container (/opt/flutter is broken). On Gui's Windows machine with the real
# Flutter SDK this file must NOT exist; delete it before any flutter command.
dependency_overrides:
  flutter:
    path: /tmp/opencode/flutter_stub
  flutter_test:
    path: /tmp/opencode/flutter_test_stub
  path_provider:
    path: /tmp/opencode/path_provider_stub
  drift_flutter:
    path: /tmp/opencode/drift_flutter_stub
